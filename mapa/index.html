<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campos Puduhue · Mapa satelital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Visor de pantalla completa: barra delgada arriba, lista de campos a la izquierda, mapa satelital al resto. */
:root{
  --azul:#2B4973; --verde:#335A34; --celeste:#9CC1D9; --cafe:#D9D2C5; --gris-d:#6D7C86; --gris-l:#A3ABB6;
  --bg:#F5F6F4; --surface:#FFFFFF; --surface-2:#F2F4F1; --border:#E2E4E0; --text:#1A2530; --text-2:#4A5A66;
  --lech:#5B8FD6; --cri:#5FBF73; --prop:#E0A15A; --contorno:#FFD54A; --potrero:#7CD27C; --bosque:#2E7D32; --camino:#C9C2B4; --canal:#4FC3F7; --constr:#FF8A65; --otro:#B0BEC5;
  --font:'Fira Sans','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#0F1620;--surface:#172230;--surface-2:#1E2B3B;--border:#2A3A4E;--text:#E8EDF2;--text-2:#A8B4C2;--azul:#9CC1D9;--cafe:#2A3A4E;--gris-d:#8CA0B5;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:13px}
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:50px;
  padding:6px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));background:var(--surface-2);border-bottom:1px solid var(--cafe)}
.bar-l{display:flex;align-items:center;gap:10px;min-width:0}
.marca{font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--azul)}
.sep{width:1px;height:16px;background:var(--cafe)}
.tit{font-weight:700;font-size:13px;color:var(--azul);white-space:nowrap}
.meta{font-size:11.5px;color:var(--gris-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font:800 10.5px var(--font);letter-spacing:.05em;text-transform:uppercase;
  color:var(--gris-d);background:var(--surface);border:1px solid var(--cafe);border-radius:999px;padding:7px 13px}
.btn:hover,.btn.on{color:var(--azul);border-color:var(--azul)}
.btn:focus-visible,.campo:focus-visible,select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr)}
.lado{min-height:0;overflow:auto;border-right:1px solid var(--cafe);background:var(--surface);padding:12px 12px 20px;display:flex;flex-direction:column;gap:14px}
.lado h2{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gris-d);margin:0 0 6px}
.lado label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--gris-d)}
.lado label[hidden]{display:none}
#l-temp{margin-top:6px}
.lado select{font:13px var(--font);color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 8px}
.zona{display:flex;flex-direction:column;gap:2px}
.campo{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  font:13px var(--font);color:var(--text);background:none;border:0;border-radius:8px;padding:7px 8px}
.campo:hover,.campo.on{background:var(--surface-2)}
.campo.on{font-weight:700;color:var(--azul)}
.campo i{width:10px;height:10px;border-radius:50%}
.campo small{color:var(--gris-d);font-size:11px;font-variant-numeric:tabular-nums}
.nota{font-size:11px;line-height:1.55;color:var(--gris-d)}
#mapa{min-height:0;background:#1d2b22}
.ley{background:rgba(255,255,255,.92);color:#1A2530;border-radius:10px;padding:8px 11px;font:12px var(--font);box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:240px}
.ley b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6D7C86;margin-bottom:5px}
.ley span{display:flex;align-items:center;gap:7px;margin:3px 0}
.ley i{width:13px;height:11px;border-radius:2px;flex:0 0 auto}
.ley .grad{height:9px;border-radius:3px;margin:4px 0 2px}
.ley .rg{display:flex;justify-content:space-between;font-size:10.5px;color:#6D7C86}
.lbl{background:none;border:0;box-shadow:none;color:#fff;font:700 11px var(--font);text-shadow:0 0 3px #000,0 0 6px #000;padding:0}
.lbl::before{display:none}
.lblc{font-size:13px;font-weight:800;letter-spacing:.02em}
.leaflet-popup-content{font:12.5px var(--font);color:#1A2530;margin:12px 14px}
.pp h3{margin:0 0 2px;font-size:14px;color:#2B4973}
.pp .s{color:#6D7C86;font-size:11px;margin-bottom:8px}
.pp table{border-collapse:collapse;width:100%}
.pp td{padding:3px 0;border-bottom:1px solid #EEE;font-variant-numeric:tabular-nums}
.pp td:last-child{text-align:right;font-weight:700}
.aviso{position:absolute;z-index:1000;left:50%;top:14px;transform:translateX(-50%);max-width:min(560px,90%);background:#FFF4E0;color:#6B4512;
  border:1px solid #F0C27A;border-radius:10px;padding:10px 14px;font:12.5px/1.5 var(--font);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.menu{display:none}
@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .lado{position:absolute;z-index:1001;top:0;bottom:0;left:0;width:min(300px,85vw);transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.abierto .lado{transform:none}
  .main{position:relative}
  .meta{display:none}.menu{display:inline-flex}
  .btn span{display:none}
}
@media (prefers-reduced-motion:reduce){.lado{transition:none}}
</style>
</head>

      if (p.t === 'Potrero' && p.ha >= 1.5 && p.n.length <= 9 && !/^(Pradera|Potrero)$/.test(p.n)) etiquetas.push(L.tooltip({permanent: true, direction: 'center', className: 'lbl'}).setLatLng(pl.getBounds().getCenter()).setContent(p.n.replace(/^Daetz /, '')));
    });
    if (c.sala) L.circleMarker([c.sala.lat, c.sala.lon], {radius: 5, color: '#fff', weight: 2, fillColor: '#E53935', fillOpacity: 1}).bindTooltip('Sala de ordeña · ' + c.campo).addTo(g);
    g.addTo(map);
    const b = c.pol.length ? g.getBounds() : (c.lat != null ? L.latLng(c.lat, c.lon).toBounds(2500) : null);
    if (b) { limites[c.campo] = b; todos.extend(b); }
    if (c.lat != null) L.marker([c.lat, c.lon], {icon: L.divIcon({className: 'lbl lblc', html: `<span style="color:${colDest(c.destino)}">●</span> ${c.campo}`, iconSize: null})})
      .on('click', () => ir(c.campo)).addTo(map);
  });
  const capaLbl = L.layerGroup(etiquetas);
  const zoomLbl = () => { if (map.getZoom() >= 15) capaLbl.addTo(map); else map.removeLayer(capaLbl); };
  map.on('zoomend', zoomLbl);

  // Leyenda
  const ley = L.control({position: 'bottomright'});
  ley.onAdd = () => { const d = L.DomUtil.create('div', 'ley'); d.id = 'ley'; return d; };
  ley.addTo(map);
  const pintaLey = () => { const d = document.getElementById('ley');
    if (capa === 'tipo') { d.innerHTML = '<b>Uso del suelo</b>' + Object.entries(TIPO).map(([k, [n, v]]) => `<span><i style="${k === 'Contorno' ? `border:2px dashed ${cssv(v)}` : `background:${cssv(v)}`}"></i>${n}</span>`).join('') +
      '<span><i style="background:#E53935;border-radius:50%;width:11px"></i>Sala de ordeña</span>'; return; }
    const K = CAPA[capa], r = rango;
    if (capa === 'rel') { d.innerHTML = `<b>${K[0]}</b><div class="grad" style="background:linear-gradient(90deg,${K[2]},${MEDIO},${K[3]})"></div><div class="rg"><span>${nf(REL[0] * 100)}% o menos</span><span>100%</span><span>${nf(REL[1] * 100)}% o más</span></div><span><i style="background:#9AA4AE"></i>Sin dato de Agrinet</span>`; return; }
    d.innerHTML = `<b>${K[0]}${capa === 't' && temp ? ' ' + temp : ''}${K[1] ? ' · ' + K[1] : ''}</b>${r ? `<div class="grad" style="background:linear-gradient(90deg,${K[2]},${K[3]})"></div><div class="rg"><span>${nf(r[0], K[4])}</span><span>${nf(r[1], K[4])}</span></div>` : ''}<span><i style="background:#9AA4AE"></i>Sin dato de Agrinet</span>`; };
  pintaLey();
  const repinta = () => { calcRango(); capas.forEach(pl => pl.setStyle(estilo(pl._p))); pintaLey(); };
  document.getElementById('capa').onchange = e => { capa = e.target.value; document.getElementById('l-temp').hidden = capa !== 't' || !TEMPS.length; repinta(); };
  document.getElementById('temp').onchange = e => { temp = e.target.value; repinta(); };

  // Lista de campos por zona
  let sel = null;
  const ir = campo => { sel = campo; const b = limites[campo]; if (b) map.flyToBounds(b, {padding: [30, 30], maxZoom: 16, duration: .8});
    document.querySelectorAll('.campo').forEach(x => x.classList.toggle('on', x.dataset.c === campo)); document.body.classList.remove('abierto'); };
  const zonas = ['Los Ríos', 'Osorno y Llanquihue', 'Chiloé'];
  document.getElementById('lista').innerHTML = zonas.map(z => `<div class="zona"><h2>${z}</h2>${C.filter(c => c.zona === z).map(c => {
    const ha = Object.entries(c.ha_tipo).filter(([t]) => t !== 'Contorno').reduce((a, [, v]) => a + v, 0);
    return `<button type="button" class="campo" data-c="${c.campo}"><i style="background:${colDest(c.destino)}"></i><span>${c.campo}<br><small>${c.destino}${c.pol.length ? '' : ' · sin plano'}</small></span><small>${c.pol.length ? nf(ha, 0) + ' ha' : ''}</small></button>`; }).join('')}</div>`).join('') +
    `<div class="zona"><h2>Destino</h2><p class="nota"><span style="color:${colDest('Lechería')}">●</span> Lechería &nbsp; <span style="color:${colDest('Crianza')}">●</span> Crianza &nbsp; <span style="color:${colDest('Propio')}">●</span> Propio</p></div>`;
  document.querySelectorAll('.campo').forEach(b => b.onclick = () => ir(b.dataset.c));
  document.getElementById('b-todo').onclick = () => { sel = null; map.flyToBounds(todos, {padding: [20, 20], duration: .8}); document.querySelectorAll('.campo').forEach(x => x.classList.remove('on')); };
  document.getElementById('b-menu').onclick = () => document.body.classList.toggle('abierto');
  document.getElementById('b-fs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); };

  const npol = C.reduce((a, c) => a + c.pol.length, 0), conP = C.filter(c => c.pol.length).length;
  document.getElementById('meta').textContent = `${nf(C.length)} campos · ${nf(conP)} con plano · ${nf(npol)} polígonos · datos del SGI al ${DATOS.generado}`;
  document.getElementById('fuente').textContent = `Planos: ${DATOS.fuente} Agrinet por potrero: ${DATOS.agrinet_fuente || ''} Imagen satelital: Esri World Imagery (la fecha de la foto varía según la zona).`;
  map.fitBounds(todos, {padding: [20, 20]});
  zoomLbl();
  const h = decodeURIComponent((location.hash || '').slice(1)); if (h && limites[h]) setTimeout(() => ir(h), 300);
})();
</script>
</body>
</html>
